<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>goscrapling browser fixture</title>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var article = document.createElement("article");
          article.id = "rendered";
          article.className = "rendered";
          article.dataset.header = "{{REQUEST_HEADER}}";
          article.textContent = "Rendered by browser JavaScript";
          document.getElementById("app").appendChild(article);
        }, 25);
      });
    </script>
  </head>
  <body>
    <main id="app"></main>
  </body>
</html>
